<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molab Screens - Demo Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0b;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .demo-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0b 0%, #161618 100%);
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Intro Slide */
        .intro-slide {
            text-align: center;
            background: radial-gradient(ellipse at center, #161618 0%, #0a0a0b 100%);
        }

        .intro-slide .logo {
            width: 400px;
            height: auto;
            margin-bottom: 2rem;
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            from { filter: drop-shadow(0 0 20px rgba(244, 185, 37, 0.3)); }
            to { filter: drop-shadow(0 0 40px rgba(244, 185, 37, 0.6)); }
        }

        .intro-slide h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #f4b925;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(244, 185, 37, 0.5);
        }

        .intro-slide .subtitle {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
        }

        /* Screenshot Slides */
        .screenshot-slide {
            padding: 2rem;
        }

        .screenshot-slide img {
            max-width: 90%;
            max-height: 75%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(244, 185, 37, 0.2);
        }

        /* Outro Slide */
        .outro-slide {
            text-align: center;
            background: radial-gradient(ellipse at center, #1a1a1c 0%, #0a0a0b 100%);
        }

        .outro-slide .logo {
            width: 300px;
            height: auto;
            margin-bottom: 2rem;
        }

        .outro-slide h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f4b925;
            margin-bottom: 1rem;
        }

        .outro-slide .tagline {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .outro-slide .contact {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
        }

        /* Caption Bar */
        .caption-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.6) 100%);
            padding: 1.5rem 2rem;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .caption {
            text-align: center;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease;
        }

        .caption.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 200;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #f4b925 0%, #d7561f 50%, #1980c2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Step Counter */
        .step-counter {
            position: fixed;
            bottom: 1.5rem;
            left: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            z-index: 150;
        }

        /* Auto-play controls */
        .play-controls {
            position: fixed;
            bottom: 1.5rem;
            right: 2rem;
            z-index: 150;
            display: flex;
            gap: 1rem;
        }

        .control-btn {
            background: rgba(244, 185, 37, 0.2);
            border: 1px solid rgba(244, 185, 37, 0.5);
            color: #f4b925;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(244, 185, 37, 0.3);
            border-color: #f4b925;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .intro-slide .logo { width: 300px; }
            .intro-slide h1 { font-size: 2.5rem; }
            .intro-slide .subtitle { font-size: 1.2rem; }
            .outro-slide h2 { font-size: 2rem; }
            .outro-slide .tagline { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <script>
        const slides = document.querySelectorAll('.slide');
        const captions = [
            'Twórz profesjonalne grafiki w kilka kliknięć',
            'Zaloguj się do panelu',
            'Opisz swoją promocję i elementy graficzne',
            'Wybierz gotowy szablon — AI dopasuje treść',
            'AI tworzy grafikę — to zajmuje 2-3 minuty',
            'Gotowe! Profesjonalna grafika na ekran w recepcji',
            'Molab Screens — Twórz. Generuj. Wyświetlaj.'
        ];
        const slideDurations = [3000, 3000, 3000, 4000, 3000, 5000, 4000]; // ms
        
        let currentSlide = 0;
        let isAutoPlaying = true;
        let autoPlayInterval;
        let progressInterval;

        const captionEl = document.getElementById('caption');
        const progressBar = document.getElementById('progressBar');
        const stepCounter = document.getElementById('stepCounter');
        const playBtn = document.getElementById('playBtn');

        function updateCaption() {
            captionEl.classList.remove('active');
            setTimeout(() => {
                captionEl.textContent = captions[currentSlide];
                captionEl.classList.add('active');
            }, 200);
        }

        function updateProgress() {
            const progress = ((currentSlide + 1) / slides.length) * 100;
            progressBar.style.width = progress + '%';
        }

        function updateStepCounter() {
            stepCounter.textContent = `${currentSlide + 1}/7`;
        }

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            
            currentSlide = index;
            updateCaption();
            updateProgress();
            updateStepCounter();
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                showSlide(currentSlide + 1);
                if (isAutoPlaying) {
                    scheduleNextSlide();
                }
            } else {
                // End of demo - restart after delay
                setTimeout(restartDemo, 2000);
            }
        }

        function scheduleNextSlide() {
            clearTimeout(autoPlayInterval);
            if (isAutoPlaying && currentSlide < slides.length - 1) {
                autoPlayInterval = setTimeout(nextSlide, slideDurations[currentSlide]);
            }
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            playBtn.textContent = isAutoPlaying ? '⏸️ Pauza' : '▶️ Play';
            
            if (isAutoPlaying) {
                scheduleNextSlide();
            } else {
                clearTimeout(autoPlayInterval);
            }
        }

        function restartDemo() {
            clearTimeout(autoPlayInterval);
            currentSlide = 0;
            showSlide(0);
            isAutoPlaying = true;
            playBtn.textContent = '⏸️ Pauza';
            scheduleNextSlide();
        }

        // Initialize
        updateProgress();
        updateStepCounter();
        
        // Start auto-play
        if (isAutoPlaying) {
            scheduleNextSlide();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'ArrowRight':
                case 'Space':
                    if (currentSlide < slides.length - 1) {
                        clearTimeout(autoPlayInterval);
                        nextSlide();
                    }
                    break;
                case 'ArrowLeft':
                    if (currentSlide > 0) {
                        clearTimeout(autoPlayInterval);
                        showSlide(currentSlide - 1);
                        if (isAutoPlaying) scheduleNextSlide();
                    }
                    break;
                case 'KeyR':
                    restartDemo();
                    break;
                case 'KeyP':
                    toggleAutoPlay();
                    break;
            }
        });

        // Click to advance
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('control-btn')) {
                if (currentSlide < slides.length - 1) {
                    clearTimeout(autoPlayInterval);
                    nextSlide();
                }
            }
        });
    </script>
</body>
